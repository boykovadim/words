<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1613" media="(prefers-color-scheme: dark)">
<title>Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"></noscript>
<style>
/* Layout: field-notebook study site — sticky top bar, page sections in one 1080px column, bottom tab bar on phones */
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --surface-2:#F4F6F2; --ink:#14251F; --muted:#5B6A64; --line:#D7DED8;
  --accent:#2F5BEA; --accent-soft:#E4EAFD; --on-accent:#FFFFFF; --sun:#D9940F;
  --good:#17905F; --good-soft:#DDF3E8; --bad:#D03C3C; --bad-soft:#FBE3E1;
  --a2:#17905F; --b1:#2D7AC9; --b2:#C9810E; --c1:#CC4F33; --c2:#8A3DB8;
  --contour:rgba(20,37,31,.09); --shadow:0 18px 44px rgba(20,37,31,.10); --shadow-s:0 4px 14px rgba(20,37,31,.06);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --nav-h:64px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#16211D; --surface-2:#1C2924; --ink:#E5EEE9; --muted:#91A29B; --line:#273630;
  --accent:#86A2FF; --accent-soft:#1D2949; --on-accent:#0E1613; --sun:#F0BE4C;
  --good:#3CC48D; --good-soft:#163628; --bad:#F07474; --bad-soft:#3A1E1E;
  --a2:#3CC48D; --b1:#6AB0F5; --b2:#F0B04C; --c1:#F2876B; --c2:#C48BEA;
  --contour:rgba(229,238,233,.07); --shadow:0 18px 44px rgba(0,0,0,.35); --shadow-s:0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --surface-2:#1C2924; --ink:#E5EEE9; --muted:#91A29B; --line:#273630;
  --accent:#86A2FF; --accent-soft:#1D2949; --on-accent:#0E1613; --sun:#F0BE4C;
  --good:#3CC48D; --good-soft:#163628; --bad:#F07474; --bad-soft:#3A1E1E;
  --a2:#3CC48D; --b1:#6AB0F5; --b2:#F0B04C; --c1:#F2876B; --c2:#C48BEA;
  --contour:rgba(229,238,233,.07); --shadow:0 18px 44px rgba(0,0,0,.35); --shadow-s:0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-block:0 calc(var(--tab-h) + 24px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topnav .wrap{height:var(--nav-h);display:flex;align-items:center;gap:20px}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;display:flex;align-items:baseline;gap:2px;text-decoration:none}
.logo i{color:var(--accent);font-style:normal}
.navlinks{display:flex;gap:4px;margin-left:12px}
.navlinks a{text-decoration:none;font-weight:700;padding:8px 12px;border-radius:10px;color:var(--muted);transition:color .2s,background .2s}
.navlinks a:hover{color:var(--ink)}
.navlinks a[aria-current="page"]{color:var(--ink);background:var(--surface)}
.navright{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:13px}
.pill svg{width:16px;height:16px;color:var(--sun)}

/* ---------- bottom tabs (phone) ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:none;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.tabs a{display:grid;justify-items:center;gap:2px;padding:6px 0;text-decoration:none;font-size:11px;font-weight:700;color:var(--muted);border-radius:12px}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}
@media (max-width:760px){ .navlinks{display:none} .tabs{display:block} }

/* ---------- common blocks ---------- */
main{padding-block:22px 10px}
.sec{margin-top:34px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(18px,3vw,22px)}
.sec-h p{color:var(--muted);max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;padding:13px 18px;border-radius:14px;transition:transform .15s,box-shadow .2s,background .2s}
.btn svg{width:18px;height:18px;flex:none}
.btn-p{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn-p:hover{transform:translateY(-1px)} .btn:active{transform:scale(.97)}
.btn-g{background:var(--surface);border:1px solid var(--line)}
.btn-g:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none;transform:none}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lvA2{--lv:var(--a2)} .lvB1{--lv:var(--b1)} .lvB2{--lv:var(--b2)} .lvC1{--lv:var(--c1)} .lvC2{--lv:var(--c2)}
.lv{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;color:var(--lv);background:color-mix(in srgb,var(--lv) 14%,transparent);white-space:nowrap}
.tag{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tag.informal{color:var(--sun);border-color:color-mix(in srgb,var(--sun) 45%,transparent)}
.tag.academic{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ico{width:22px;height:22px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;padding:clamp(22px,4vw,40px);align-items:center}
.hero h1{font-size:clamp(28px,5vw,46px);font-weight:800;line-height:1.05}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{margin-top:14px;font-size:16px;color:var(--muted);max-width:44ch}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.goalcard{justify-self:end;background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:24px;padding:18px;display:grid;justify-items:center;gap:6px;width:min(100%,260px)}
.ring{width:150px;height:150px}
.ring circle{fill:none;stroke-width:12}
.ring .bgc{stroke:var(--surface-2)}
.ring .fg{stroke:url(#rg);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring text{fill:var(--ink);font-family:var(--f-display);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.stat{padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:26px;line-height:1.1}
.stat small{color:var(--muted);font-size:12.5px}

/* word of the day */
.wod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:22px;align-items:center;position:relative;overflow:hidden}
.wod .w{font-family:var(--f-display);font-size:clamp(26px,4.5vw,36px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.wod .tr{font-weight:800;font-size:18px;margin-top:6px}
.ex{font-style:italic;color:var(--muted);line-height:1.5;margin-top:10px}
.ex b{color:var(--accent);font-style:normal}
.wod .acts{display:flex;gap:8px;flex-wrap:wrap}

/* groups & topics */
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.group{position:relative;text-align:left;padding:18px;display:grid;gap:12px;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .25s;overflow:hidden}
.group:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow-s)}
.group .gi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.group h3{font-family:var(--f-body);font-weight:800;font-size:17px}
.group p{color:var(--muted);font-size:13px}
.group .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.topic{text-align:left;padding:16px;display:grid;gap:10px;transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s;min-width:0;animation:rise .45s both}
.topic:hover{transform:translateY(-3px);border-color:var(--accent)}
.topic .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.topic h3{font-family:var(--f-body);font-weight:800;font-size:15.5px;line-height:1.25}
.topic .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;align-items:center}
.dots{display:flex;gap:4px}.dot{width:8px;height:8px;border-radius:50%;background:var(--lv)}
.due{font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--sun)}
.gsec{scroll-margin-top:calc(var(--nav-h) + 14px)}
.gsec + .gsec{margin-top:30px}
.ghead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ghead .gi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ghead h2{font-size:19px}

/* modes */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mode{text-align:left;padding:18px;display:grid;gap:8px;transition:transform .2s,border-color .2s,box-shadow .2s}
.mode:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-s)}
.mode .mi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mode b{font-weight:800;font-size:16px}
.mode small{color:var(--muted);font-size:12.5px;line-height:1.4}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lvcard{text-align:left;padding:14px;display:grid;gap:8px;transition:transform .2s,border-color .2s}
.lvcard:hover{transform:translateY(-3px);border-color:var(--lv)}
.lvcard b{font-family:var(--f-display);font-size:22px;color:var(--lv)}
.lvcard small{color:var(--muted);font-size:12px}

/* filters */
.filters{padding:16px;display:grid;gap:12px}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.frow .label{width:100%}
.searchbox{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.searchbox input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;padding:13px 0;outline:none}
.picked{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:14px}
.picked b{font-family:var(--f-display);font-size:24px}

/* word list */
.list{overflow:hidden}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) auto;gap:12px;padding:12px 16px;align-items:center;cursor:pointer}
.row summary::-webkit-details-marker{display:none}
.row summary:hover{background:var(--surface-2)}
.row .en{font-weight:800;min-width:0;overflow-wrap:anywhere}
.row .ru{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.row .side{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.row .more{padding:0 16px 14px;display:grid;gap:10px;animation:rise .3s both}
.row .more .ex{margin:0}
.row .more .acts{display:flex;gap:8px;flex-wrap:wrap}
.mini{padding:7px 11px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.mini svg{width:15px;height:15px}
.boxes{display:flex;gap:3px}
.boxes i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.boxes i.on{background:var(--good)}
.loadmore{display:block;width:100%;padding:14px;font-weight:800;color:var(--accent);border-top:1px solid var(--line)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}

/* topic banner */
.banner{position:relative;overflow:hidden;padding:clamp(18px,3vw,28px);display:grid;gap:14px}
.banner canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.banner > *{position:relative}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--muted);font-weight:700}
.banner h1{font-size:clamp(24px,4vw,34px)}
.banner .nums{display:flex;gap:18px;flex-wrap:wrap}
.banner .nums div{display:grid}
.banner .nums b{font-family:var(--f-display);font-size:20px}

/* stats page */
.statgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
.lvrow{display:grid;grid-template-columns:44px minmax(0,1fr) 92px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lvrow:first-child{border-top:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .gridl{stroke:var(--line)}
.chart rect.b{fill:var(--accent)}
.chart rect.t{fill:var(--sun)}

/* ---------- study stage ---------- */
.stage{max-width:680px;margin:0 auto;display:grid;gap:14px}
.stagehead{display:flex;align-items:center;gap:12px}
.stagehead h2{font-size:18px;flex:1;min-width:0}
.iconbtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.track{flex:1;height:8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.combo{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--sun)}
.combo svg{width:16px;height:16px}
.combo.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.toggle button{padding:8px 12px;font-weight:800;font-size:13px}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.deck{position:relative;height:min(60vh,430px);perspective:1400px;touch-action:pan-y}
.fc{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:22px;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face .fhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.face .fbody{flex:1;display:grid;place-content:center;text-align:center;gap:14px;padding:8px 4px;min-height:0}
.face .stripe{position:absolute;left:0;right:0;top:0;height:6px;background:var(--lv)}
.word{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,6.5vw,42px);line-height:1.15;overflow-wrap:anywhere}
.trans{font-weight:800;font-size:clamp(20px,4.8vw,28px);line-height:1.3;overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:13px}
.speak{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface-2)}
.speak svg{width:18px;height:18px}
.swipe-tag{position:absolute;top:22px;font-family:var(--f-display);font-weight:800;font-size:15px;padding:6px 12px;border-radius:10px;border:2px solid;opacity:0;pointer-events:none}
.swipe-tag.yes{right:22px;color:var(--good);transform:rotate(8deg)}
.swipe-tag.no{left:22px;color:var(--bad);transform:rotate(-8deg)}
.flashok .face{animation:flashOk .55s}
.flashbad .face{animation:flashBad .55s}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rate button{padding:14px 8px;border-radius:16px;font-weight:800;border:1px solid var(--line);background:var(--surface);display:grid;gap:2px;transition:transform .12s,background .2s}
.rate button:active{transform:scale(.95)}
.rate small{font-weight:600;color:var(--muted);font-size:11px}
.rate .no{color:var(--bad)} .rate .mid{color:var(--sun)} .rate .yes{color:var(--good)}
.rate .no:hover{background:var(--bad-soft)} .rate .yes:hover{background:var(--good-soft)}
.fly-left{transition:transform .42s ease-in,opacity .42s!important;transform:translateX(-130%) rotate(-18deg)!important;opacity:0}
.fly-right{transition:transform .42s ease-in,opacity .42s!important;transform:translateX(130%) rotate(18deg)!important;opacity:0}
.enter{animation:enter .45s cubic-bezier(.2,.9,.3,1.15) both}

/* question card + feedback */
.q{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow);display:grid;gap:16px;animation:enter .4s both;transition:border-color .3s,background .3s}
.q.is-ok{border-color:var(--good);animation:glowOk .9s ease-out}
.q.is-bad{border-color:var(--bad);animation:glowBad .9s ease-out, shake .4s}
.prompt{text-align:center;display:grid;gap:10px;padding:8px 0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{position:relative;padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;text-align:left;
  transition:transform .15s,border-color .25s,background .25s,color .25s,opacity .3s;overflow-wrap:anywhere;min-width:0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.opt:hover:not([disabled]){border-color:var(--accent);transform:translateY(-1px)}
.opt .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.opt .mk{width:24px;height:24px;flex:none;display:none}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);animation:pulse .5s}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shake .4s}
.opt.ok .mk,.opt.bad .mk{display:block}
.opt.ok .k,.opt.bad .k{display:none}
.opt.dim{opacity:.45}
.verdict{position:absolute;left:50%;top:-22px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:99px;
  font-weight:800;font-size:14px;box-shadow:var(--shadow-s);animation:badge .55s cubic-bezier(.2,.9,.3,1.4) both;white-space:nowrap}
.verdict.ok{background:var(--good);color:var(--on-accent)} .verdict.bad{background:var(--bad);color:#fff}
.verdict svg{width:22px;height:22px}
.verdict svg .draw{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .15s forwards}
.xp{position:absolute;right:22px;top:16px;font-family:var(--f-display);font-weight:800;color:var(--good);animation:xp 1s ease-out forwards;pointer-events:none}
.explain{border-radius:20px;padding:16px;display:grid;gap:10px;animation:slideup .45s cubic-bezier(.2,.8,.2,1) both;border:1px solid var(--line);background:var(--surface-2)}
.explain.ok{background:color-mix(in srgb,var(--good-soft) 70%,var(--surface));border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.explain.bad{background:color-mix(in srgb,var(--bad-soft) 70%,var(--surface));border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.explain .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.explain .pair{font-weight:800;font-size:17px}
.explain .pair span{color:var(--muted);font-weight:600}
.explain .ex{margin:0;font-size:15.5px}
.explain .ex.none{font-style:normal;font-size:13px}
.explain .tags{display:flex;gap:6px;flex-wrap:wrap}
.nextrow{display:flex;justify-content:flex-end;gap:10px}
.typein{display:flex;gap:10px}
.typein input{flex:1;min-width:0;padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:18px;font-weight:700;transition:border-color .25s,background .25s}
.typein input.ok{border-color:var(--good);background:var(--good-soft)}
.typein input.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.tryagain{text-align:center;font-weight:700;color:var(--bad);min-height:22px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{padding:14px 12px;min-height:68px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;transition:transform .25s,opacity .4s,border-color .2s,background .2s,color .2s;overflow-wrap:anywhere;min-width:0}
.tile.sel{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.02)}
.tile.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);animation:pulse .4s}
.tile.gone{opacity:0;transform:scale(.85);pointer-events:none}
.tile.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shake .4s}

.result{padding:28px;text-align:center;display:grid;gap:14px;justify-items:center;box-shadow:var(--shadow);animation:enter .45s both}
.missed{width:100%;text-align:left;display:grid;gap:8px}
.missed div{padding:10px 14px;border-radius:14px;background:var(--surface-2);display:grid;gap:2px}
.missed .ex{margin:0;font-size:13.5px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:11px 16px;border-radius:12px;font-weight:700;z-index:70;animation:enter .3s both;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
footer{margin-top:40px;color:var(--muted);font-size:12.5px;text-align:center}

@keyframes rise{from{transform:translateY(12px);opacity:.001}to{transform:none;opacity:1}}
@keyframes enter{from{transform:translateY(22px) scale(.95);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.035)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes glowOk{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
@keyframes glowBad{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
@keyframes flashOk{0%{box-shadow:0 0 0 0 var(--good);border-color:var(--good)}100%{box-shadow:0 0 0 26px transparent}}
@keyframes flashBad{0%{box-shadow:0 0 0 0 var(--bad);border-color:var(--bad)}100%{box-shadow:0 0 0 26px transparent}}
@keyframes badge{from{transform:translateX(-50%) translateY(10px) scale(.6);opacity:0}to{transform:translateX(-50%);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes xp{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-36px);opacity:0}}
@keyframes slideup{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* contour lines — the page's geographic texture */
function contours(canvas, seed){
  if(!canvas) return;
  const r=canvas.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.max(1,r.width*dpr); canvas.height=Math.max(1,r.height*dpr);
  const g=canvas.getContext("2d"); g.scale(dpr,dpr); g.strokeStyle=cssVar("--contour"); g.lineWidth=1.1;
  let s=seed; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  [0,1].forEach(()=>{ const px=r.width*(.55+rnd()*.5), py=r.height*(rnd()*1.1), ph=rnd()*6.28;
    for(let k=1;k<=12;k++){ const R=k*28; g.beginPath();
      for(let a=0;a<=6.3;a+=.05){ const w=1+.17*Math.sin(a*3+ph+k*.3)+.08*Math.sin(a*5-k*.5); const x=px+Math.cos(a)*R*w*1.4, y=py+Math.sin(a)*R*w; a===0?g.moveTo(x,y):g.lineTo(x,y); }
      g.closePath(); g.stroke(); } });
}

/* ================= filters state ================= */
const F = { levels:new Set(), pos:new Set(), reg:new Set(), core:false, nb:false };
try{ const f=JSON.parse(localStorage.getItem("words-filters")||"null"); if(f){ F.levels=new Set(f.l); F.pos=new Set(f.p); F.reg=new Set(f.r); F.core=!!f.c; F.nb=!!f.n; } }catch(e){}
function saveF(){ try{ localStorage.setItem("words-filters", JSON.stringify({l:[...F.levels],p:[...F.pos],r:[...F.reg],c:F.core,n:F.nb})); }catch(e){} }
function pass(c){ return (!F.levels.size||F.levels.has(c.lv)) && (!F.pos.size||F.pos.has(c.pos)) && (!F.reg.size||F.reg.has(c.reg)) && (!F.core||c.core) && (!F.nb||c.nb); }
const pool = (topic="all") => CARDS.filter(c => (topic==="all"||c.t===topic) && pass(c));
const anyF = () => F.levels.size||F.pos.size||F.reg.size||F.core||F.nb;
function filtersHtml(){
  const chip=(g,k,l)=>`<button class="chip" data-g="${g}" data-k="${k}" aria-pressed="${F[g].has(k)}">${l}</button>`;
  return `<div class="label">Уровень</div><div class="frow">${LEVELS.map(l=>chip("levels",l,l)).join("")}</div>
    <div class="label">Часть речи</div><div class="frow">${Object.keys(POS).map(k=>chip("pos",k,POS[k])).join("")}</div>
    <div class="label">Стиль и набор</div><div class="frow">${Object.keys(REG).map(k=>chip("reg",k,REG[k])).join("")}
      <button class="chip" data-t="core" aria-pressed="${F.core}">Только 3000 частых</button>
      <button class="chip" data-t="nb" aria-pressed="${F.nb}">Из моей тетради</button>
      ${anyF()?'<button class="chip" id="freset">Сбросить</button>':""}</div>`;
}
function wireFilters(root, redraw){
  $$(".chip[data-g]",root).forEach(b=>b.onclick=()=>{ const s=F[b.dataset.g], k=b.dataset.k; s.has(k)?s.delete(k):s.add(k); saveF(); redraw(); });
  $$(".chip[data-t]",root).forEach(b=>b.onclick=()=>{ F[b.dataset.t]=!F[b.dataset.t]; saveF(); redraw(); });
  const r=$("#freset",root); if(r) r.onclick=()=>{ F.levels.clear(); F.pos.clear(); F.reg.clear(); F.core=false; F.nb=false; saveF(); redraw(); };
}

/* ================= STUDY: common ================= */

/* ================= flashcards ================= */
let dir="en";
function startCards(list,title,t){ if(!list.length) return toast("Здесь пока нечего повторять"); session={list:list.slice(0,40),i:0,flipped:false,title,t,stats:[0,0,0],render:renderCard}; window.scrollTo({top:0}); renderCard(); }
function renderCard(){

        <span class="swipe-tag yes">ЗНАЮ</span><span class="swipe-tag no">НЕ ПОМНЮ</span></div>

        ${enFront?`<div class="word" style="font-size:clamp(18px,4.4vw,24px);color:var(--muted)">${esc(c.en)}</div><div class="trans">${esc(c.ru)}</div>`:`<div class="trans" style="font-size:18px;color:var(--muted)">${esc(c.ru)}</div><div class="word">${esc(c.en)}</div>`}

  fc.addEventListener("pointermove",e=>{ if(!drag) return; dx=e.clientX-sx; if(Math.abs(dx)>6) moved=true;

    $$(".swipe-tag.yes",fc).forEach(el=>el.style.opacity=Math.max(0,Math.min(1,dx/90))); $$(".swipe-tag.no",fc).forEach(el=>el.style.opacity=Math.max(0,Math.min(1,-dx/90))); });

}
function rateCard(q){

}

/* ================= quiz ================= */
function startQuiz(cs,title,t){
  const voc=cs.filter(c=>c.kind==="vocab"); if(voc.length<4) return toast("Для теста нужно хотя бы 4 слова — сними часть фильтров");
  const qs=shuffle(voc).slice(0,10).map(c=>{ const d=Math.random()<.5?"en":"ru";
    const same=shuffle(voc.filter(o=>o!==c&&o.pos===c.pos&&o.ru!==c.ru&&o.en!==c.en)), rest=shuffle(voc.filter(o=>o!==c&&o.ru!==c.ru));
    const others=[...same,...rest].filter((o,i,a)=>a.indexOf(o)===i).slice(0,3); return {c,dir:d,opts:shuffle([c,...others])}; });
  session={qs,i:0,ok:0,combo:0,missed:[],title,t,render:renderQuiz}; window.scrollTo({top:0}); renderQuiz();
}
function renderQuiz(){
  const s=session, q=s.qs[s.i];
  if(!q) return renderResult("Тест завершён", s.ok, s.qs.length, s.missed, s.t, ()=>startQuiz(s.t?pool(s.t):pool("all").length>=4?pool("all"):CARDS, s.title, s.t));
  $("#app").innerHTML = `<div class="stage">${stageHead(s.title, s.i, s.qs.length, `<span class="combo" id="combo">${I.flame}${s.combo}</span>`)}
    <div class="q" id="qc" style="margin-top:14px"><div class="prompt"><span class="label">${q.dir==="en"?"Выбери перевод":"Как это по-английски?"}</span>
      <div class="${q.dir==="en"?"word":"trans"}">${esc(q.dir==="en"?q.c.en:q.c.ru)}</div><div style="display:flex;gap:6px;justify-content:center">${tagsHtml(q.c)}</div></div>
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span>${esc(q.dir==="en"?o.ru:o.en)}</span><span class="k">${k+1}</span><span class="mk"></span></button>`).join("")}</div>
      <div id="ex"></div></div></div>`;
  $("#exit").onclick=()=>backTo(s.t);
  s.answered=false; $$(".opt").forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.k));
}
function answerQuiz(k){
  const s=session, q=s.qs[s.i]; if(s.answered) return; s.answered=true;
  const pick=q.opts[k], right=pick===q.c, qc=$("#qc");
  $$(".opt").forEach(x=>{ const o=q.opts[+x.dataset.k]; x.disabled=true;
    if(o===q.c){ x.classList.add("ok"); $(".mk",x).innerHTML=I.check; } else if(+x.dataset.k===k){ x.classList.add("bad"); $(".mk",x).innerHTML=I.cross; } else x.classList.add("dim"); });
  qc.classList.add(right?"is-ok":"is-bad"); qc.insertAdjacentHTML("afterbegin", verdictHtml(right));
  if(right){ s.ok++; s.combo++; qc.insertAdjacentHTML("beforeend",'<span class="xp">+1</span>'); const cb=$("#combo"); cb.innerHTML=I.flame+s.combo; cb.classList.add("pop"); speak(q.c.en); }

  grade(q.c, right?2:0);

  $("#ex").innerHTML = explainHtml(q.c, right, right?"":"Это слово вернётся в повторение уже сегодня.");
  const nx=$("#next"); nx.onclick=()=>{ s.i++; renderQuiz(); }; nx.focus({preventScroll:true});
  const sy=$("#say2"); if(sy) sy.onclick=()=>speak(q.c.en);
  $("#ex").scrollIntoView({block:"nearest",behavior:reduced()?"auto":"smooth"});
}

/* ================= write ================= */
function norm(s){ return s.toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z' -]/g," ").replace(/\b(to|a|an|the|sb|sth)\b/g," ").replace(/\s+/g," ").trim(); }
function accepted(c){ const b=c.en.split(" (")[0]; return b.split(" / ").map(norm).concat([norm(b)]); }
function startWrite(cs,title,t){
  const voc=shuffle(cs.filter(c=>c.kind==="vocab")).sort((a,b)=>(b.ex?1:0)-(a.ex?1:0)).slice(0,10);
  if(!voc.length) return toast("Здесь нет слов для письма"); session={qs:shuffle(voc),i:0,ok:0,combo:0,missed:[],title,t,render:renderWrite,tries:0,hint:0}; window.scrollTo({top:0}); renderWrite();
}
function renderWrite(){
  const s=session, c=s.qs[s.i];
  if(!c) return renderResult("Письмо завершено", s.ok, s.qs.length, s.missed, s.t, ()=>startWrite(s.t?pool(s.t):pool("all"), s.title, s.t));
  const gap=c.ex?exHtml(c.ex).replace(/<b>.*?<\/b>/,"<b>_____</b>"):"";
  $("#app").innerHTML = `<div class="stage">${stageHead(s.title, s.i, s.qs.length, `<span class="combo" id="combo">${I.flame}${s.combo}</span>`)}
    <div class="q" id="qc" style="margin-top:14px"><div class="prompt"><span class="label">Напиши по-английски</span><div class="trans">${esc(c.ru)}</div>${gap?`<p class="ex" style="margin:0 auto;max-width:46ch">${gap}</p>`:""}<div style="display:flex;gap:6px;justify-content:center">${tagsHtml(c)}</div></div>
      <form class="typein" id="wf" autocomplete="off"><input id="wi" placeholder="${s.hint?esc(c.en.slice(0,s.hint))+"…":"Слово или фраза"}" autocapitalize="off" spellcheck="false" aria-label="Ответ"><button class="btn btn-p" type="submit">Проверить</button></form>
      <div class="tryagain" id="ta" aria-live="polite"></div>
      <div class="btns" id="aux"><button class="btn btn-g" id="hint" type="button">Подсказка</button><button class="btn btn-g" id="skip" type="button">Не знаю</button></div>
      <div id="ex"></div></div></div>`;
  $("#exit").onclick=()=>backTo(s.t);
  const inp=$("#wi"); inp.focus();
  const finish=(right)=>{ const qc=$("#qc"); inp.disabled=true; $("#aux").hidden=true; $("#ta").textContent="";
    inp.classList.add(right?"ok":"bad"); qc.classList.add(right?"is-ok":"is-bad"); qc.insertAdjacentHTML("afterbegin",verdictHtml(right));
    grade(c, right?(s.tries||s.hint?1:2):0);
    if(right){ s.ok++; s.combo++; qc.insertAdjacentHTML("beforeend",'<span class="xp">+1</span>'); const cb=$("#combo"); cb.innerHTML=I.flame+s.combo; cb.classList.add("pop"); speak(c.en); }
    else { s.combo=0; $("#combo").innerHTML=I.flame+"0"; s.missed.push(c); }
    $("#trk").style.width=((s.i+1)/s.qs.length*100)+"%"; $("#trkn").textContent=(s.i+1)+"/"+s.qs.length;
    $("#ex").innerHTML=explainHtml(c,right, right?(s.tries||s.hint?"Засчитано с подсказкой — повторим завтра.":""):"Правильный ответ выделен выше. Слово вернётся сегодня.");
    $("#next").onclick=()=>{ s.i++; s.tries=0; s.hint=0; renderWrite(); }; $("#next").focus({preventScroll:true});
    const sy=$("#say2"); if(sy) sy.onclick=()=>speak(c.en);
    $("#ex").scrollIntoView({block:"nearest",behavior:reduced()?"auto":"smooth"}); };
  $("#wf").onsubmit=e=>{ e.preventDefault(); if(inp.disabled) return; const v=norm(inp.value); if(!v) return;
    if(accepted(c).includes(v)) finish(true);
    else { s.tries++; if(s.tries>=2) finish(false); else { inp.classList.remove("bad"); void inp.offsetWidth; inp.classList.add("bad"); $("#ta").textContent="Не совсем — попробуй ещё раз"; setTimeout(()=>inp.classList.remove("bad"),450); inp.select(); } } };
  $("#hint").onclick=()=>{ s.hint=Math.min(c.en.length,s.hint+2); inp.placeholder=c.en.slice(0,s.hint)+"…"; inp.focus(); };
  $("#skip").onclick=()=>finish(false);
}

/* ================= match ================= */
function startMatch(cs,title,t){
  const voc=shuffle(cs.filter(c=>c.kind==="vocab")).filter((c,i,a)=>a.findIndex(o=>o.ru===c.ru)===i).slice(0,6);
  if(voc.length<3) return toast("Для пар нужно хотя бы 3 слова");
  const tiles=shuffle(voc.flatMap((c,k)=>[{k,txt:c.en,side:"en"},{k,txt:c.ru,side:"ru"}]));
  session={voc,tiles,sel:null,done:0,errors:0,start:Date.now(),title,t,render:renderMatch}; window.scrollTo({top:0}); renderMatch();
}
function renderMatch(){
  const s=session;
  $("#app").innerHTML = `<div class="stage">${stageHead(s.title, s.done, s.voc.length, `<span class="label mono" id="timer">0.0 c</span>`)}
    <div class="mgrid" style="margin-top:6px">${s.tiles.map((x,i)=>`<button class="tile" data-i="${i}">${esc(x.txt)}</button>`).join("")}</div></div>`;
  $("#exit").onclick=()=>{ clearInterval(s.iv); backTo(s.t); };
  clearInterval(s.iv); s.iv=setInterval(()=>{ const el=$("#timer"); if(el) el.textContent=((Date.now()-s.start)/1000).toFixed(1)+" c"; else clearInterval(s.iv); },100);
  $$(".tile").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, x=s.tiles[i];
    if(s.sel===null){ s.sel=i; b.classList.add("sel"); return; }
    if(s.sel===i){ s.sel=null; b.classList.remove("sel"); return; }
    const y=s.tiles[s.sel], prev=$(`.tile[data-i="${s.sel}"]`); s.sel=null; prev.classList.remove("sel");
    if(y.k===x.k && y.side!==x.side){
      b.classList.add("ok"); prev.classList.add("ok"); s.done++; grade(s.voc[x.k],2); speak(x.side==="en"?x.txt:y.txt);
      setTimeout(()=>{ b.classList.add("gone"); prev.classList.add("gone"); },420);
      $("#trk").style.width=s.done/s.voc.length*100+"%"; $("#trkn").textContent=s.done+"/"+s.voc.length;
      if(s.done===s.voc.length){ clearInterval(s.iv); const sec=((Date.now()-s.start)/1000).toFixed(1);
        setTimeout(()=>renderResult("Все пары собраны", s.voc.length, s.voc.length, [], s.t, ()=>startMatch(s.t?pool(s.t):pool("all"), s.title, s.t), `Время: ${sec} c · ошибок: ${s.errors}`, s.voc),700); }
    } else { s.errors++; b.classList.add("bad"); prev.classList.add("bad"); setTimeout(()=>{ b.classList.remove("bad"); prev.classList.remove("bad"); },450); }
  });
}

/* ================= result ================= */
function renderResult(title, ok, total, missed, t, again, note, review){
  const pct=total?Math.round(ok/total*100):0, C=2*Math.PI*62;
  const msg = pct>=90?"Отлично!":pct>=70?"Хороший результат":pct>=40?"Неплохо, есть что повторить":"Повтори эти слова и попробуй снова";
  session={render:()=>renderResult(title,ok,total,missed,t,again,note,review), t};
  const list = missed.length ? missed : (review||[]);
  $("#app").innerHTML = `<div class="stage"><div class="stagehead"><button class="iconbtn" id="exit" aria-label="Назад">${I.back}</button><h2>${esc(title)}</h2></div>
    <div class="panel result"><svg class="ring" viewBox="0 0 150 150" role="img" aria-label="${pct}%"><circle class="bgc" cx="75" cy="75" r="62"/><circle class="fg" id="rr" cx="75" cy="75" r="62" stroke-dasharray="${C}" stroke-dashoffset="${C}"/><text x="75" y="86" text-anchor="middle" font-size="30">${pct}%</text></svg>
      <h2 style="font-size:20px">${msg}</h2><div class="muted">${ok} из ${total}${note?" · "+esc(note):""}</div>
      ${list.length?`<div class="missed"><span class="label">${missed.length?"Слова с ошибками":"Слова из раунда"}</span>${list.map(c=>`<div><span><b>${esc(c.en)}</b> <span class="muted">— ${esc(c.ru)}</span></span>${c.ex?`<p class="ex">${exHtml(c.ex)}</p>`:""}</div>`).join("")}</div>`:""}
      <div class="btns"><button class="btn btn-p" id="again">Ещё раунд</button><button class="btn btn-g" id="done">${t?"К теме":"На главную"}</button></div></div></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const r=$("#rr"); if(r) r.style.strokeDashoffset=C*(1-pct/100); }));
  $("#exit").onclick = $("#done").onclick = ()=>{ session=null; t?go("t-"+t):go("home"); };
  $("#again").onclick=again;
  if(pct>=80) confetti();
}
function confetti(){
  if(reduced()) return; const cv=$("#confetti"); cv.hidden=false; const g=cv.getContext("2d"); cv.width=innerWidth; cv.height=innerHeight;
  const cols=[cssVar("--accent"),cssVar("--sun"),cssVar("--good"),cssVar("--c2")];
  const ps=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:4+Math.random()*6,r:Math.random()*6,c:cols[Math.floor(Math.random()*4)]}));
  let f=0; (function tick(){ g.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{ p.vy+=.33; p.x+=p.vx; p.y+=p.vy; p.r+=.2; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); g.restore(); });
    if(++f<120) requestAnimationFrame(tick); else { g.clearRect(0,0,cv.width,cv.height); cv.hidden=true; } })();
}

/* ================= keyboard ================= */
document.addEventListener("keydown",e=>{
  if(!session || e.target.tagName==="INPUT") return;
  if(session.render===renderCard){ if(e.key==="1") rateCard(0); if(e.key==="2") rateCard(1); if(e.key==="3") rateCard(2); }
  if(session.render===renderQuiz){ if(!session.answered && /^[1-4]$/.test(e.key)) answerQuiz(+e.key-1); }
});

let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ contours($("#topo"),42); },150); });
window.addEventListener("pagehide", flush);
render();
})();
</script>
